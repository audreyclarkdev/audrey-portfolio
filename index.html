<!doctype html>

    <meta name="theme-color" content="#0d0e14" />

    <!-- Pick light or dark mode before the page draws: saved choice first, then the device setting -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="canonical" href="https://audreyclark.dev/" />

    <!-- Link previews (LinkedIn, Slack, Facebook, iMessage) -->
